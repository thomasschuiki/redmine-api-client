name: Release Redmine Plugin

on:
  push:
    branches:
      - main
    tags:
      - plugin/v*.*.*
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redmine: ["5.1.12", "6.0.10", "6.1.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create redmine-test

      - name: Start MySQL
        run: |
          docker run --rm -d --network redmine-test --name test-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=redmine_test \
            mysql:8.0
          for i in $(seq 1 15); do
            docker exec test-mysql mysql -h localhost -uroot -proot -e "SELECT 1" 2>/dev/null && break
            sleep 2
          done

      - name: Test plugin on Redmine ${{ matrix.redmine }}
        run: |
          TMPOUT=$(mktemp -d)
          set +e
          docker run --rm --network redmine-test --name test-redmine \
            -v "${PWD}/plugin/redmine_openapi_generator:/usr/src/redmine/plugins/redmine_openapi_generator:ro" \
            -v "${TMPOUT}:/output" \
            "redmine:${{ matrix.redmine }}" /bin/bash -exc '
              cp /usr/src/redmine/plugins/redmine_openapi_generator/config/database_ci.yml /usr/src/redmine/config/database.yml
              cd /usr/src/redmine
              RAILS_ENV=test bundle exec rake db:migrate 2>&1
              RAILS_ENV=test OUTPUT_PATH=/output/openapi.yaml bundle exec ruby plugins/redmine_openapi_generator/generate_spec.rb
            '
          EXITCODE=$?
          set -e
          [ $EXITCODE -eq 0 ] || exit $EXITCODE
          cp "${TMPOUT}/openapi.yaml" openapi.yaml

      - name: Validate spec output
        run: |
          grep -q "openapi:" openapi.yaml
          grep -q "paths:" openapi.yaml
          echo "Spec OK for Redmine ${{ matrix.redmine }}"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-mysql test-redmine 2>/dev/null || true
          docker network rm redmine-test 2>/dev/null || true
          rm -f openapi.yaml

  release:
    if: startsWith(github.ref, 'refs/tags/plugin/v')
    runs-on: ubuntu-latest
    needs: test-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get version
        id: version
        run: echo "TAG=${GITHUB_REF_NAME#plugin/v}" >> "$GITHUB_OUTPUT"

      - name: Build CLI binaries (redmine & redmine-spec)
        run: |
          for dir in cmd/*/; do
            name=$(basename "$dir")
            go build -o "$name" "./$dir"
            tar czf "go-redmine-cli-$name-${{ steps.version.outputs.TAG }}-linux-amd64.tar.gz" "$name"
            rm "$name"
          done

      - name: Create plugin archive
        run: |
          cd plugin
          tar czf "../redmine-openapi-generator-${{ steps.version.outputs.TAG }}.tar.gz" redmine_openapi_generator/
          cd redmine_openapi_generator
          zip -r "../../redmine-openapi-generator-${{ steps.version.outputs.TAG }}.zip" .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            redmine-openapi-generator-${{ steps.version.outputs.TAG }}.tar.gz
            redmine-openapi-generator-${{ steps.version.outputs.TAG }}.zip
            go-redmine-cli-*${{ steps.version.outputs.TAG }}-linux-amd64.tar.gz
          tag_name: ${{ github.ref_name }}
          name: go-redmine-cli ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
