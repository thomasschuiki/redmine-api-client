name: Release Redmine Plugin

on:
  push:
    branches:
      - main
    tags:
      - plugin/v*.*.*
    paths:
      - plugin/**
  pull_request:
    branches:
      - main
    paths:
      - plugin/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redmine: ["5.1.12", "6.0.10", "6.1.3"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Create Docker network
        run: docker network create redmine-test

      - name: Start MySQL
        run: |
          docker run --rm -d --network redmine-test --name test-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=redmine_test \
            mysql:8.0.37
          for i in $(seq 1 15); do
            docker exec test-mysql mysql -h localhost -uroot -proot -e "SELECT 1" 2>/dev/null && break
            sleep 2
          done

      - name: Test plugin on Redmine ${{ matrix.redmine }}
        run: |
          TMPOUT=$(mktemp -d)
          set +e
          docker run --rm --network redmine-test --name test-redmine \
            -v "${PWD}/plugin/redmine_openapi_generator:/usr/src/redmine/plugins/redmine_openapi_generator:ro" \
            -v "${TMPOUT}:/output" \
            "redmine:${{ matrix.redmine }}" /bin/bash -exc '
              cp /usr/src/redmine/plugins/redmine_openapi_generator/config/database_ci.yml /usr/src/redmine/config/database.yml
              cd /usr/src/redmine
              RAILS_ENV=test bundle exec rake db:migrate 2>&1
              RAILS_ENV=test OUTPUT_PATH=/output/openapi.yaml bundle exec ruby plugins/redmine_openapi_generator/generate_spec.rb
            '
          EXITCODE=$?
          set -e
          [ $EXITCODE -eq 0 ] || exit $EXITCODE
          cp "${TMPOUT}/openapi.yaml" openapi.yaml

      - name: Strict-validate generated spec
        run: |
          go run ./cmd/redmine-spec spec validate --strict --spec openapi.yaml

      - name: Check snapshot drift
        run: |
          if ! diff -q openapi.yaml "testdata/openapi/redmine-${{ matrix.redmine }}.yaml"; then
            echo "Generated spec for Redmine ${{ matrix.redmine }} differs from the committed snapshot."
            echo "Run ./scripts/gen-spec-snapshots.sh and commit the regenerated snapshots."
            exit 1
          fi
          echo "No snapshot drift for Redmine ${{ matrix.redmine }}"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-mysql test-redmine 2>/dev/null || true
          docker network rm redmine-test 2>/dev/null || true
          rm -f openapi.yaml

  sync-generated:
    if: startsWith(github.ref, 'refs/tags/plugin/v')
    runs-on: ubuntu-latest
    needs: test-plugin
    steps:
      # Tag checkouts are detached HEADs where `git push` fails, so check out
      # main explicitly and sync regenerated artifacts back to it.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Regenerate versioned snapshots
        run: ./scripts/gen-spec-snapshots.sh

      - name: Sync CLI contract and generated models
        run: |
          cp testdata/openapi/redmine-6.1.3.yaml docs/openapi/openapi.yaml
          go run ./cmd/redmine-spec generate-models --spec docs/openapi/openapi.yaml --out internal/models

      - name: Commit generated artifacts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi/openapi.yaml testdata/openapi internal/models/models.go
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
          else
            git commit -m "chore(plugin): regenerate OpenAPI spec for ${{ github.ref_name }}"
            git push origin main
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/plugin/v')
    runs-on: ubuntu-latest
    needs: test-plugin
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        run: echo "TAG=${GITHUB_REF_NAME#plugin/v}" >> "$GITHUB_OUTPUT"

      - name: Create plugin archive
        run: |
          cd plugin
          tar czf "../redmine-openapi-generator-${{ steps.version.outputs.TAG }}.tar.gz" redmine_openapi_generator/
          cd redmine_openapi_generator
          zip -r "../../redmine-openapi-generator-${{ steps.version.outputs.TAG }}.zip" .

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            redmine-openapi-generator-${{ steps.version.outputs.TAG }}.tar.gz
            redmine-openapi-generator-${{ steps.version.outputs.TAG }}.zip
          tag_name: ${{ github.ref_name }}
          name: Redmine OpenAPI Generator ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
