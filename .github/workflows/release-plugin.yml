name: Release Redmine Plugin

on:
  push:
    branches:
      - main
    tags:
      - plugin/v*.*.*
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redmine: ["5.1.12", "6.0.10", "6.1.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL
        run: |
          docker run --rm -d --name test-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=redmine_test \
            mysql:8.0
          docker exec test-mysql sh -c \
            'until mysqladmin ping -h localhost -uroot -proot 2>/dev/null; do sleep 2; done'
          echo "MySQL ready"

      - name: Test plugin on Redmine ${{ matrix.redmine }}
        continue-on-error: true
        run: |
          TMPOUT=$(mktemp -d)
          docker run --rm --name test-redmine \
            --link test-mysql:mysql \
            -v "${PWD}/plugin/redmine_openapi_generator:/usr/src/redmine/plugins/redmine_openapi_generator:ro" \
            -v "${TMPOUT}:/output" \
            "redmine:${{ matrix.redmine }}" sh -c '
              cat /usr/src/redmine/config/database.yml 2>/dev/null || true
              cat > /usr/src/redmine/config/database.yml <<EOF
              test:
                adapter: mysql2
                host: mysql
                port: 3306
                database: redmine_test
                username: root
                password: root
                encoding: utf8mb4
              EOF
              cd /usr/src/redmine
              RAILS_ENV=test bundle exec rake db:migrate 2>&1 | tail -5
              RAILS_ENV=test OUTPUT_PATH=/output/openapi.yaml bundle exec ruby plugins/redmine_openapi_generator/generate_spec.rb 2>&1
              echo "DONE"
            ' || true
          ls -la "${TMPOUT}/" 2>/dev/null || echo "TMPOUT empty"
          cp "${TMPOUT}/openapi.yaml" openapi.yaml 2>/dev/null || echo "openapi.yaml not found"

      - name: Validate spec output
        run: |
          if [ ! -f openapi.yaml ]; then
            echo "ERROR: openapi.yaml not generated"
            exit 1
          fi
          grep -q "openapi:" openapi.yaml || { echo "Missing openapi key"; exit 1; }
          grep -n "paths:" openapi.yaml || { echo "Missing paths key"; exit 1; }
          routes=$(grep -E '^\s+[a-z]' openapi.yaml | grep -c ':$' || true)
          echo "Generated spec with $routes path entries for Redmine ${{ matrix.redmine }}"
          ls -lh openapi.yaml

      - name: Cleanup
        if: always()
        run: docker rm -f test-mysql test-redmine 2>/dev/null; rm -f openapi.yaml

  release:
    if: startsWith(github.ref, 'refs/tags/plugin/v')
    runs-on: ubuntu-latest
    needs: test-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get version
        id: version
        run: echo "TAG=${GITHUB_REF_NAME#plugin/v}" >> "$GITHUB_OUTPUT"

      - name: Build CLI binaries (redmine & redmine-spec)
        run: |
          for dir in cmd/*/; do
            name=$(basename "$dir")
            go build -o "$name" "./$dir"
            tar czf "go-redmine-cli-$name-${{ steps.version.outputs.TAG }}-linux-amd64.tar.gz" "$name"
            rm "$name"
          done

      - name: Create plugin archive
        run: |
          cd plugin
          tar czf "../redmine-openapi-generator-${{ steps.version.outputs.TAG }}.tar.gz" redmine_openapi_generator/
          cd redmine_openapi_generator
          zip -r "../../redmine-openapi-generator-${{ steps.version.outputs.TAG }}.zip" .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            redmine-openapi-generator-${{ steps.version.outputs.TAG }}.tar.gz
            redmine-openapi-generator-${{ steps.version.outputs.TAG }}.zip
            go-redmine-cli-*${{ steps.version.outputs.TAG }}-linux-amd64.tar.gz
          tag_name: ${{ github.ref_name }}
          name: go-redmine-cli ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
