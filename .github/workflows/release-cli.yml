name: Release CLI

on:
  push:
    branches:
      - main
    tags:
      - cli/v*.*.*
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
  pull_request:
    branches:
      - main
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Strict-validate committed contract
        run: |
          go run ./cmd/redmine-spec spec validate --strict --spec docs/openapi/openapi.yaml

      - name: Check model drift
        run: |
          TMPDIR_GO=$(mktemp -d)
          go run ./cmd/redmine-spec generate-models --spec docs/openapi/openapi.yaml --out "$TMPDIR_GO"
          if ! diff -q "$TMPDIR_GO/models.go" internal/models/models.go; then
            echo "internal/models/models.go is out of date."
            echo "Run: go run ./cmd/redmine-spec generate-models --spec docs/openapi/openapi.yaml --out internal/models"
            exit 1
          fi
          echo "Models are in sync with docs/openapi/openapi.yaml"

  release:
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get previous release tag
        id: tags
        run: |
          previous=$(git tag --list 'cli/v*' --sort=-version:refname | sed "/^${GITHUB_REF_NAME}$/d" | head -n1)
          test -n "$previous"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#cli/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build CLI binaries
        run: |
          for dir in cmd/*/; do
            name=$(basename "$dir")
            go build -o "$name" "./$dir"
            tar czf "go-redmine-cli-$name-${{ steps.tags.outputs.version }}-linux-amd64.tar.gz" "$name"
            rm "$name"
          done

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: go-redmine-cli-*${{ steps.tags.outputs.version }}-linux-amd64.tar.gz
          tag_name: ${{ github.ref_name }}
          name: go-redmine-cli ${{ steps.tags.outputs.version }}
          generate_release_notes: true
          previous_tag: ${{ steps.tags.outputs.previous }}
